[package]
name = "litty-term"
version = "0.6.0"
edition = "2024"
description = "litty: a tiny, fast, zero-config terminal emulator for macOS and Linux"
license = "MIT"
repository = "https://github.com/stawan15/litty"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "tty", "pty"]
categories = ["command-line-utilities"]
include = ["src/**", "assets/thai-words.bin", "assets/SymbolsNerdFont*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "litty"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/litty-{ version }-{ target }.tar.gz"
bin-dir = "litty-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.deb]
name = "litty"
maintainer = "stawan15"
section = "utils"
extended-description = "Zero config: tabs and splits, scrollback with reflow, ligatures, command blocks and Thai support."
priority = "optional"
depends = "$auto, curl"
assets = [
    ["target/release/litty", "usr/bin/", "755"],
    ["packaging/litty.desktop", "usr/share/applications/", "644"],
    ["packaging/litty.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["README.md", "usr/share/doc/litty/", "644"],
]

[package.metadata.generate-rpm]
name = "litty"
assets = [
    { source = "target/release/litty", dest = "/usr/bin/litty", mode = "755" },
    { source = "packaging/litty.desktop", dest = "/usr/share/applications/litty.desktop", mode = "644" },
    { source = "packaging/litty.png", dest = "/usr/share/icons/hicolor/512x512/apps/litty.png", mode = "644" },
]

[dependencies]
ab_glyph = "0.2.32"
ed25519-compact = { version = "2", default-features = false }
nix = { version = "0.31.3", features = ["term", "process", "ioctl"] }
rustybuzz = "0.20.1"
ttf-parser = "0.25"
png = "0.17"
unicode-width = "0.2.2"
vte = "0.15.0"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-io-surface = "0.3"
objc2-quartz-core = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer = "0.4.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
