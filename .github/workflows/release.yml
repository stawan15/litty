name: Release
# Push a tag such as v0.2.0 (matching the version in Cargo.toml) to build and publish the macOS app.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: cargo test --release
      - run: packaging/build-app.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "lite-term ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
