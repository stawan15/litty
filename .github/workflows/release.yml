name: Release
# Push a tag such as v0.2.0 (matching the version in Cargo.toml) to build every artifact and publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: cargo test --release
      - name: Signing certificate
        # Optional: with a Developer ID certificate the app is signed and notarized, so macOS
        # opens it without the right-click → Open step.
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain >/dev/null
          rm cert.p12
          echo "SIGN_ID=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)" >> "$GITHUB_ENV"
      - run: packaging/build-app.sh
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz

  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: Packages
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir out
          d=litty-$VERSION-${{ matrix.target }}
          mkdir $d
          cp target/release/litty README.md LICENSE packaging/litty.desktop packaging/litty.png packaging/litty.terminfo $d/
          tar -czf out/$d.tar.gz $d
          tic -x -o target/terminfo packaging/litty.terminfo
          cargo deb --no-build --output out/
          cargo generate-rpm --output out/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: out/*

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      LITTY_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      WEBSITE_DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Sign artifacts for the self-updater
        if: env.LITTY_SIGNING_KEY != ''
        run: cargo run --release --example sign -- artifacts/*.dmg artifacts/*.tar.gz artifacts/*.deb artifacts/*.rpm
      - name: Checksums and manifests
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          (cd artifacts && sha256sum * > SHA256SUMS)
          packaging/render.sh "$VERSION" artifacts/SHA256SUMS manifests
          cp manifests/PKGBUILD artifacts/PKGBUILD
      - name: GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "litty ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
      - name: Refresh the website
        # Redeploying litty.teveus.xyz clears its caches, so it shows this release right away.
        if: env.WEBSITE_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$WEBSITE_DEPLOY_HOOK" -o /dev/null
      - name: Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-tap" tap
          mkdir -p tap/Casks tap/Formula
          cp manifests/cask.rb tap/Casks/litty.rb
          cp manifests/formula.rb tap/Formula/litty.rb
          cd tap
          git config user.name "litty release bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "litty ${GITHUB_REF_NAME#v}"
          git push
      - name: crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish
